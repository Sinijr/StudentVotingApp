{% extends "base.html" %}
    {% load static %}
    {% block extra_css %}<link rel="stylesheet" href="{% static "forms.css" %}">{% endblock %}
    
    {% block content %}
    <section>
        {% if form.errors %}
            <div class="errors">
                {{ form.errors }}
            </div>
        {% endif %}
        <h2>Already have an account please Log in </h2>
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <span>MatNo</span>
                {{ form.username }}
            </div>
            <div class="input-group">
                <span>Password</span>
                {{ form.password }}
            </div>
              <button class="btn">Log in</button>
        </form>
    </section>
{% endblock %}
